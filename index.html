<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>Sourcedown — Source-Mode Markdown for Streaming AI Output</title>
    <meta
      name="description"
      content="React component that renders markdown with all source characters visible and copyable. Built on CodeMirror 6 for streaming AI output — no hidden syntax, no replaced markers."
    />
    <meta name="author" content="Sourcedown" />
    <meta name="theme-color" content="#fafafa" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical -->
    <link rel="canonical" href="https://sourcedown.vercel.app" />

    <!-- Favicon — # mark encoded for data URI, fits source-mode theme -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='85' font-family='ui-monospace,monospace'>%23</text></svg>"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sourcedown.vercel.app" />
    <meta
      property="og:title"
      content="Sourcedown — Source-Mode Markdown for Streaming AI Output"
    />
    <meta
      property="og:description"
      content="React component that renders markdown with all source characters visible and copyable. Built on CodeMirror 6 for streaming AI output — no hidden syntax, no replaced markers."
    />
    <meta property="og:site_name" content="Sourcedown" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="Sourcedown — Source-Mode Markdown for Streaming AI Output"
    />
    <meta
      name="twitter:description"
      content="React component that renders markdown with all source characters visible and copyable. Built on CodeMirror 6 for streaming AI output."
    />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Sourcedown",
        "description": "Source-mode markdown renderer for AI streaming output. Renders markdown with all source characters visible and copyable — no hidden syntax, no replaced markers.",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "url": "https://sourcedown.vercel.app"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/demo/main.tsx"></script>
  </body>
</html>
